# ======================================================================== #
# SHAFKTime
#
# Plugin : temps AFK récompensé. Un joueur qui a du temps AFK en réserve et se trouve dans un monde autorisé
# gagne des SHCoins chaque seconde, jusqu'à épuisement de sa réserve. La réserve se remplit avec /shafktime add
# (récompenses de vote, boutique). Avec SHNetwork, la réserve de chaque joueur est dans une base partagée
# (voir la section 'reseau' en bas du fichier) ; les mondes autorisés n'existent que sur le serveur du spawn,
# les sessions AFK ne tournent donc que là.
#
# Commandes (racine d'administration, console comprise) :
#   /shafktime check <joueur>          Temps AFK en réserve.
#   /shafktime add <joueur> <durée>    Ajoute du temps (5s, 10m, 2h, 1d).
#   /shafktime take <joueur> <durée>   Retire du temps.
#   /shafktime set <joueur> <durée>    Fixe le temps.
#   /shafktime import                  Avec SHNetwork : copie les temps de players.yml dans la base, sans rien écraser.
#   /shafktime reload                  Recharge config.yml et messages.yml ; un fichier illisible ne change rien.
#                                      players.yml n'est jamais relu. 'reseau' demande un redémarrage.
#   Avec SHNetwork, add, take et set vers un joueur d'un autre serveur lui sont transmis ; check lit la base.
#
# Permissions (op par défaut) :
#   shafktime.admin            Parent de toutes les permissions d'administration :
#     shafktime.admin.check      /shafktime check
#     shafktime.admin.add        /shafktime add
#     shafktime.admin.take       /shafktime take
#     shafktime.admin.set        /shafktime set
#     shafktime.admin.import     /shafktime import
#     shafktime.admin.reload     /shafktime reload
#   shafktime.boost.<n>        Gain majoré de n % (la plus grande valeur est retenue, par exemple shafktime.boost.20).
#
# Les messages sont dans messages.yml. Placeholders du texte de la bossbar et de l'actionbar : {time}, {money}, {boost}.
#
# ======================================================================== #

money-per-second: 1.0
whitelist-worlds:
- world
time-format: "{h}h {m}m {s}s"
min-session: 60
autosave-delay: 300

bossbar:
  enabled: true
  message: '&fAFK récompensé: &b{time} &8| &fGains: &3{money} SHCoins &7(1.{boost}x)'
  color: BLUE
  style: SOLID
actionbar:
  enabled: true
  message: '&fAFK récompensé: &b{time} &8| &fGains: &3{money} SHCoins &7(1.{boost}x)'

# Mode réseau. Actif seulement si SHNetwork est installé et 'actif' vaut true : le temps AFK est alors dans la base
# partagée (table shafktime : uuid, seconds) au lieu de players.yml. Il est lu à la connexion du joueur, une fois que
# l'autre serveur a fini de le sauvegarder, et écrit à chaque sauvegarde automatique, à chaque commande d'administration
# et au départ du joueur. Le temps déjà dans players.yml se copie une fois avec /shafktime import.
# Sans SHNetwork, rien de ceci n'est utilisé. Demande un redémarrage.
reseau:
  actif: true
  # Durée maximale, en secondes, pendant laquelle on attend que l'autre serveur ait fini de sauvegarder
  # le joueur avant de lire son temps
  attente-max-secondes: 10
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/minecraft"
    utilisateur: CHANGE_ME
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes
    delai-ms: 3000
