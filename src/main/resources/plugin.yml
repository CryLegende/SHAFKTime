name: SHAFKTime
version: '${project.version}'
main: org.Cry_Legende.sHAFKTime.SHAFKTime
api-version: '1.20'
author: Cry_Legende
depend: [Vault]
# SHNetwork est facultatif : sans lui, le temps AFK reste dans players.yml comme avant.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (temps AFK en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shafktime:
    description: Administration du temps AFK récompensé (check, add, take, set, import, reload).
    usage: /shafktime <check|add|take|set|import|reload>
    permission: shafktime.admin.check;shafktime.admin.add;shafktime.admin.take;shafktime.admin.set;shafktime.admin.import;shafktime.admin.reload

permissions:
  shafktime.admin:
    description: Toute l'administration de SHAFKTime.
    default: op
    children:
      shafktime.admin.check: true
      shafktime.admin.add: true
      shafktime.admin.take: true
      shafktime.admin.set: true
      shafktime.admin.import: true
      shafktime.admin.reload: true
  shafktime.admin.check:
    description: Voir le temps AFK en réserve d'un joueur (/shafktime check).
    default: op
  shafktime.admin.add:
    description: Ajouter du temps AFK à un joueur (/shafktime add).
    default: op
  shafktime.admin.take:
    description: Retirer du temps AFK à un joueur (/shafktime take).
    default: op
  shafktime.admin.set:
    description: Fixer le temps AFK d'un joueur (/shafktime set).
    default: op
  shafktime.admin.import:
    description: Copier players.yml dans la base partagée, mode réseau (/shafktime import).
    default: op
  shafktime.admin.reload:
    description: Recharger config.yml et messages.yml (/shafktime reload).
    default: op
  shafktime.boost:
    description: 'Permission de base pour appliquer un boost au gain (à utiliser avec le suffixe numérique, ex: shafktime.boost.20).'
    default: true
