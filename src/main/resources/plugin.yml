name: SHAFKTime
version: '${project.version}'
main: org.Cry_Legende.sHAFKTime.SHAFKTime
api-version: '1.20'
author: Cry_Legende
depend: [Vault]
# SHNetwork est facultatif : sans lui, le temps AFK reste dans players.yml comme avant.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (temps AFK en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shafktime:
    description: Commande de gestion du temps AFK.
    usage: /shafktime <check|add|take|set|import> <joueur> [temps]
    permission: shafktime.admin

permissions:
  shafktime.admin:
    description: Permet d'utiliser les commandes administratives du plugin SHAFKTime.
    default: op
  shafktime.boost:
    description: 'Permission de base pour appliquer un boost au gain (à utiliser avec le suffixe numérique, ex: shafktime.boost.20).'
    default: true
